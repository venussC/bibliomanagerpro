<!doctype html>
<html lang="en">
<head>
    <title>Inicio de sesión</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />

<body>
    <main>
        <div class="container-fluid h-100">
            <div class="row h-100 align-items-center justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card-body" id="card3">
                        <!-- Sección del formulario -->
                        <div class="form-section">
                            <h4 class="card-title">Inicio de sesión</h4>
                            <form method="POST" action="../php/login.php">
                                <div class="mb-3">
                                    <label for="exampleInputEmail1" class="form-label">Usuario</label>
                                    <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="usuario">
                                    <div id="emailHelp" class="form-text">We'll never share your information with anyone else.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="exampleInputPassword1" class="form-label" >Password</label>
                                    <input type="password" class="form-control" id="exampleInputPassword1" name="password">
                                </div>
                                <button type="submit" class="btn btn-primary"  id="btnlogin">Submit</button>
                            </form>
                            <br>
                            <a href="../html/recuper.html">Olvidaste la contraseña?</a>
                        </div>

                        <!-- Sección del logo -->
                        <div id="logo_section">
                            <img src="../css/Logobibliomanagerpro.png" alt="BiblioManager Logo">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
